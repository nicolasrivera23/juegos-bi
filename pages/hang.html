<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahorcado: Data Studio</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-panel: #1e293b;
      --primary: #6b21a8;
      --primary-light: #9333ea;
      --accent: #10b981;
      --error: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --key-bg: #334155;
      --key-hover: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 1.25rem;
      max-width: 720px;
    }

    h1 {
      font-size: 1.85rem;
      margin-bottom: 0.35rem;
      background: linear-gradient(90deg, #c084fc, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .game-container {
      background: var(--bg-panel);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 1.5rem;
      max-width: 760px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      padding: 0.65rem 1.1rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .top-bar span {
      color: var(--accent);
    }

    .top-bar .lives span {
      color: #f87171;
    }

    .canvas-area {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      width: 100%;
    }

    svg.hangman-svg {
      width: 170px;
      height: 190px;
      stroke: #e2e8f0;
      stroke-width: 4;
      stroke-linecap: round;
      fill: none;
    }

    .figure-part {
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .figure-part.visible {
      opacity: 1;
    }

    .clue-box {
      flex: 1;
      min-width: 240px;
      background: rgba(15, 23, 42, 0.5);
      border-left: 4px solid var(--primary-light);
      padding: 1rem 1.25rem;
      border-radius: 8px;
    }

    .clue-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #c084fc;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .clue-text {
      font-size: 1rem;
      line-height: 1.45;
      color: var(--text-main);
    }

    .word-display {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin: 0.5rem 0;
      min-height: 52px;
    }

    .word-group {
      display: flex;
      gap: 0.35rem;
      margin: 0 0.5rem;
    }

    .letter-slot {
      width: 36px;
      height: 46px;
      border-bottom: 3px solid #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.45rem;
      font-weight: 700;
      text-transform: uppercase;
      transition: transform 0.2s, border-color 0.2s, color 0.2s;
    }

    .letter-slot.revealed {
      border-color: var(--accent);
      color: var(--accent);
      animation: pop 0.25s ease;
    }

    .letter-slot.missed {
      border-color: var(--error);
      color: var(--error);
    }

    @keyframes pop {
      0% { transform: scale(0.75); }
      70% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    .keyboard {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.45rem;
      max-width: 620px;
      width: 100%;
    }

    .key {
      width: 42px;
      height: 44px;
      background: var(--key-bg);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, opacity 0.2s;
    }

    .key:hover:not(:disabled) {
      background: var(--key-hover);
      transform: translateY(-2px);
    }

    .key:disabled {
      cursor: default;
      opacity: 0.55;
    }

    .key.correct {
      background: rgba(16, 185, 129, 0.25);
      border-color: var(--accent);
      color: var(--accent);
      opacity: 1;
    }

    .key.wrong {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--error);
      color: #fca5a5;
    }

    @media (max-width: 520px) {
      .letter-slot {
        width: 28px;
        height: 38px;
        font-size: 1.2rem;
      }
      .key {
        width: 34px;
        height: 40px;
        font-size: 0.9rem;
      }
    }

    .status-banner {
      width: 100%;
      text-align: center;
      padding: 0.9rem;
      border-radius: 10px;
      font-weight: 600;
      display: none;
    }

    .status-banner.win {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--accent);
      color: #6ee7b7;
    }

    .status-banner.lose {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--error);
      color: #fca5a5;
    }

    .btn {
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      color: white;
      border: none;
      padding: 0.75rem 1.6rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    .btn.hidden {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>📊 Ahorcado: Looker Studio</h1>
    <p class="subtitle">Adivina los términos clave de visualización y modelado en Looker Studio (puedes usar el teclado físico o táctil).</p>
  </header>

  <main class="game-container">
    <div class="top-bar">
      <div>Palabra: <span id="round-info">1 / 8</span></div>
      <div>Puntaje: <span id="score-info">0</span></div>
      <div class="lives">Vidas: <span id="lives-info">6</span></div>
    </div>

    <div class="canvas-area">
      <svg class="hangman-svg" viewBox="0 0 180 200">
        <!-- Estructura base -->
        <line x1="20" y1="185" x2="100" y2="185" />
        <line x1="50" y1="185" x2="50" y2="20" />
        <line x1="50" y1="20" x2="125" y2="20" />
        <line x1="125" y1="20" x2="125" y2="42" />
        <!-- Partes del cuerpo (6 intentos) -->
        <circle cx="125" cy="60" r="18" class="figure-part" id="part-0" />
        <line x1="125" y1="78" x2="125" y2="130" class="figure-part" id="part-1" />
        <line x1="125" y1="92" x2="98" y2="115" class="figure-part" id="part-2" />
        <line x1="125" y1="92" x2="152" y2="115" class="figure-part" id="part-3" />
        <line x1="125" y1="130" x2="102" y2="165" class="figure-part" id="part-4" />
        <line x1="125" y1="130" x2="148" y2="165" class="figure-part" id="part-5" />
      </svg>

      <div class="clue-box">
        <div class="clue-label">💡 Pista del concepto</div>
        <div class="clue-text" id="clue-text">Cargando pista...</div>
      </div>
    </div>

    <div class="word-display" id="word-display"></div>

    <div class="status-banner" id="status-banner"></div>
    <button class="btn hidden" id="next-btn" onclick="nextWord()">Siguiente Concepto ➔</button>

    <div class="keyboard" id="keyboard"></div>
  </main>

  <script>
    /* =========================================================================
       CONFIGURACIÓN DEL JUEGO (ZONA EDITABLE SIN SABER PROGRAMAR)
       =========================================================================
       Instrucciones para personalizar:
       1. Puedes agregar, quitar o editar conceptos dentro de PALABRAS_LOOKER.
       2. Cada elemento debe respetar este formato:
          { palabra: "TERMINO", pista: "Descripción o pista del concepto" },
       3. Las tildes se normalizan automáticamente (ej. "MÉTRICA" acepta la letra "E").
       4. Puedes cambiar el número máximo de errores permitidos en MAX_INTENTOS (máximo 6).
       ========================================================================= */

    const MAX_INTENTOS = 6;

    const PALABRAS_LOOKER = [
      {
        palabra: "DIMENSION",
        pista: "Campo de categoría o atributo (como País, Fecha o Producto) por el cual se agrupan los datos."
      },
      {
        palabra: "METRICA",
        pista: "Agregación numérica calculada sobre un conjunto de datos (como Suma de Ventas o Recuento)."
      },
      {
        palabra: "CONECTOR",
        pista: "Mecanismo que vincula Looker Studio con una fuente externa como BigQuery, Google Sheets o GA4."
      },
      {
        palabra: "COMBINACION",
        pista: "Funcionalidad (Data Blending) que permite unir hasta 5 fuentes de datos usando una clave en común."
      },
      {
        palabra: "CAMPO CALCULADO",
        pista: "Columna nueva creada mediante fórmulas o funciones como CASE, SUM o CONCAT dentro del informe."
      },
      {
        palabra: "CONTROL DE FILTRO",
        pista: "Componente interactivo (lista desplegable o selector de fechas) que permite al usuario segmentar el reporte."
      },
      {
        palabra: "TARJETA DE RESULTADOS",
        pista: "Visualización (Scorecard) diseñada para destacar un único KPI principal y su comparación porcentual."
      },
      {
        palabra: "DESGLOSE",
        pista: "Opción (Drill-down) que permite explorar distintos niveles de jerarquía en un gráfico, como Año > Mes > Día."
      }
    ];

    /* =========================================================================
       LÓGICA DEL JUEGO (NO ES NECESARIO MODIFICAR DE AQUÍ EN ADELANTE)
       ========================================================================= */

    const ALFABETO = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("");
    let palabrasJuego = [];
    let indiceActual = 0;
    let errores = 0;
    let puntaje = 0;
    let letrasAdivinadas = new Set();
    let juegoTerminado = false;

    const roundInfo = document.getElementById("round-info");
    const scoreInfo = document.getElementById("score-info");
    const livesInfo = document.getElementById("lives-info");
    const clueText = document.getElementById("clue-text");
    const wordDisplay = document.getElementById("word-display");
    const keyboardEl = document.getElementById("keyboard");
    const statusBanner = document.getElementById("status-banner");
    const nextBtn = document.getElementById("next-btn");

    function normalizar(texto) {
      return texto
        .toUpperCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function mezclar(lista) {
      const copia = [...lista];
      for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
      }
      return copia;
    }

    function iniciarJuego() {
      palabrasJuego = mezclar(PALABRAS_LOOKER);
      indiceActual = 0;
      puntaje = 0;
      scoreInfo.textContent = puntaje;
      cargarRonda();
    }

    function cargarRonda() {
      errores = 0;
      letrasAdivinadas.clear();
      juegoTerminado = false;

      statusBanner.className = "status-banner";
      statusBanner.textContent = "";
      nextBtn.classList.add("hidden");

      roundInfo.textContent = `${indiceActual + 1} / ${palabrasJuego.length}`;
      livesInfo.textContent = MAX_INTENTOS;
      clueText.textContent = palabrasJuego[indiceActual].pista;

      for (let i = 0; i < 6; i++) {
        document.getElementById(`part-${i}`).classList.remove("visible");
      }

      renderizarTeclado();
      renderizarPalabra();
    }

    function renderizarTeclado() {
      keyboardEl.innerHTML = "";
      ALFABETO.forEach(letra => {
        const btn = document.createElement("button");
        btn.className = "key";
        btn.textContent = letra;
        btn.id = `key-${letra}`;
        btn.addEventListener("click", () => manejarLetra(letra));
        keyboardEl.appendChild(btn);
      });
    }

    function renderizarPalabra(revelarTodo = false) {
      wordDisplay.innerHTML = "";
      const palabraOriginal = palabrasJuego[indiceActual].palabra.toUpperCase();
      const grupos = palabraOriginal.split(" ");

      grupos.forEach(grupo => {
        const groupDiv = document.createElement("div");
        groupDiv.className = "word-group";

        for (const char of grupo) {
          const slot = document.createElement("div");
          slot.className = "letter-slot";
          const charNorm = normalizar(char);

          if (letrasAdivinadas.has(charNorm)) {
            slot.textContent = char;
            slot.classList.add("revealed");
          } else if (revelarTodo) {
            slot.textContent = char;
            slot.classList.add("missed");
          }
          groupDiv.appendChild(slot);
        }
        wordDisplay.appendChild(groupDiv);
      });
    }

    function manejarLetra(letra) {
      if (juegoTerminado || letrasAdivinadas.has(letra)) return;

      const btn = document.getElementById(`key-${letra}`);
      if (!btn || btn.disabled) return;
      btn.disabled = true;

      const palabraNorm = normalizar(palabrasJuego[indiceActual].palabra);

      if (palabraNorm.includes(letra)) {
        letrasAdivinadas.add(letra);
        btn.classList.add("correct");
        renderizarPalabra();
        verificarVictoria();
      } else {
        btn.classList.add("wrong");
        if (errores < 6) {
          document.getElementById(`part-${errores}`).classList.add("visible");
        }
        errores++;
        livesInfo.textContent = Math.max(0, MAX_INTENTOS - errores);

        if (errores >= MAX_INTENTOS) {
          finalizarRonda(false);
        }
      }
    }

    function verificarVictoria() {
      const palabraNorm = normalizar(palabrasJuego[indiceActual].palabra).replace(/\s+/g, "");
      const completada = [...palabraNorm].every(c => letrasAdivinadas.has(c));
      if (completada) {
        puntaje += (MAX_INTENTOS - errores) * 10 + 50;
        scoreInfo.textContent = puntaje;
        finalizarRonda(true);
      }
    }

    function finalizarRonda(gano) {
      juegoTerminado = true;
      document.querySelectorAll(".key").forEach(k => (k.disabled = true));

      if (gano) {
        statusBanner.className = "status-banner win";
        statusBanner.textContent = `🎉 ¡Correcto! Dominaste el concepto "${palabrasJuego[indiceActual].palabra}".`;
      } else {
        renderizarPalabra(true);
        statusBanner.className = "status-banner lose";
        statusBanner.textContent = `❌ Sin intentos. El término era: "${palabrasJuego[indiceActual].palabra}".`;
      }

      nextBtn.classList.remove("hidden");
      if (indiceActual + 1 >= palabrasJuego.length) {
        nextBtn.textContent = `Reiniciar Desafío (Puntaje Final: ${puntaje}) ↻`;
      } else {
        nextBtn.textContent = "Siguiente Concepto ➔";
      }
    }

    function nextWord() {
      indiceActual++;
      if (indiceActual >= palabrasJuego.length) {
        iniciarJuego();
      } else {
        cargarRonda();
      }
    }

    // Soporte para teclado físico
    document.addEventListener("keydown", (e) => {
      const tecla = normalizar(e.key);
      if (e.key.toUpperCase() === "Ñ") {
        manejarLetra("Ñ");
      } else if (ALFABETO.includes(tecla) && e.key.length === 1) {
        manejarLetra(tecla);
      } else if (e.key === "Enter" && juegoTerminado) {
        nextWord();
      }
    });

    iniciarJuego();
  </script>
</body>
</html>
